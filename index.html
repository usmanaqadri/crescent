<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Mosque Prayer Board</title>
    <style>
        :root {
            /* Light mode colors */
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #111;
            --subtext-color: #333;
            --accent-bg: rgba(0, 0, 0, 0.05);
            --highlight-outline: rgba(0, 0, 0, 0.08);
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --shuruq-bg: linear-gradient(180deg, #fff4d2, #ffe5a0);
            --shuruq-border: #f2b600;
            --shuruq-text: #5a4200;
            --hijri-color: #005b96;
            /* deep blue, readable on light background */
        }

        body.dark {
            /* Dark mode overrides */
            --bg-color: #0b1220;
            --card-bg: linear-gradient(180deg, #07101a, #0e1b2a);
            --text-color: #fff;
            --subtext-color: #bbb;
            --accent-bg: rgba(255, 255, 255, 0.04);
            --highlight-outline: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.6);
            --shuruq-bg: linear-gradient(180deg, #5c4200, #a27c00);
            --shuruq-border: #ffd257;
            --shuruq-text: #fff2c2;
            --hijri-color: #b0d8ff;
            /* soft blue, readable on dark background */
        }

        html,
        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.8s ease, color 0.8s ease;
            overflow-y: hidden;
        }

        .wrap {
            display: flex;
            flex-direction: column;
        }

        html,
        body,
        .wrap {
            min-height: 100vh;
            /* Fill at least the full screen */
            height: auto;
            /* But expand beyond if needed */
            background: var(--bg-color);
        }

        header {
            padding: 16px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 0.6px;
        }

        .sub {
            color: var(--subtext-color);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        /* --- Fade & Background Phases --- */
        #nextMessage {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 14px;
            line-height: 1.6;
            opacity: 1;
            transition: opacity 0.6s ease-in-out, background-color 0.8s ease,
                color 0.8s ease;
            border-radius: 10px;
            padding: 10px 14px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
        }

        #nextMessage.fade-out {
            opacity: 0;
        }

        /* Phase background styles */
        .phase-before {
            background-color: rgba(255, 215, 0, 0.15);
            /* gold/amber */
        }

        .phase-iqama {
            background-color: rgba(0, 200, 83, 0.15);
            /* soft green */
        }

        .phase-next {
            background-color: rgba(33, 150, 243, 0.15);
            /* soft blue */
        }

        .phase-shuruq {
            background-color: rgba(255, 160, 0, 0.15);
            /* warm orange */
        }

        .phase-jumuah {
            background-color: rgba(0, 150, 136, 0.15);
            /* teal */
        }

        main {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 12px;
            align-items: center;
            justify-content: center;
        }

        .card {
            display: flex;
            flex-direction: column;
            width: min(1100px, 98%);
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 30px var(--shadow-color);
            transition: background 0.8s ease, box-shadow 0.8s ease;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .prayer {
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            background: var(--accent-bg);
            transition: background 0.8s ease;
        }

        .prayer.current {
            outline: 3px solid #f7d65c;
            box-shadow: 0 0 12px 2px rgba(247, 214, 92, 0.6);
            background: var(--accent-bg);
            transition: all 0.5s ease;
        }

        .name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .time {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        #dateLine {
            color: var(--subtext-color);
            font-size: 1rem;
        }

        #hijriDate {
            color: var(--hijri-color);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .iqama {
            margin-top: 6px;
            opacity: 0.9;
            font-size: 1rem;
        }

        #flyerOverlay {
            position: fixed;
            inset: 0;
            z-index: 999999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.9);
            opacity: 0;
            pointer-events: none;
            transition: opacity 600ms ease;
        }

        #flyerOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .flyer-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;

            opacity: 0;
            transition: opacity 900ms ease-in-out;
        }

        .flyer-slide.active {
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 10px;
            opacity: 0.8;
            font-size: 0.9rem;
            color: var(--subtext-color);
        }

        #ytPlayerWrap {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 1000;

            width: clamp(260px, 30vw, 420px);
            aspect-ratio: 16 / 9;

            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px var(--shadow-color);
            background: #000;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 250ms ease, visibility 250ms ease;
        }

        #ytPlayerWrap.inactive {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #ytPlayer {
            width: 100%;
            height: 100%;
            border: 0;
        }

        body.dark #ytPlayerWrap {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
        }

        @media (max-width: 900px) {
            #ytPlayerWrap {
                width: 240px;
                left: 12px;
                bottom: 12px;
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .time {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px 24px;
        ">
            <div style="display: flex; align-items: center; gap: 12px">
                <img src="./logo.png" alt="Mosque Logo" id="mosqueLogo"
                    style="height: 60px; width: auto; border-radius: 8px" />
                <div>
                    <h1 id="mosqueName" style="margin: 0">Your Mosque Name</h1>
                    <div class="sub" style="margin-top: 4px; font-size: 0.95rem; opacity: 0.8" id="dateLine">
                        Loading…
                    </div>
                    <div id="hijriDate" style="
                font-size: 0.9rem;
                margin-top: 2px;
                color: var(--hijri-color);
                font-weight: 500;
              "></div>
                </div>
            </div>
            <div style="font-size: 1.8rem; font-weight: 600" id="liveClock">
                --:--:--
            </div>
            <!-- <button id="themeToggle" style="background:none;border:1px solid var(--subtext-color);color:var(--text-color);
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.9rem;">
                Toggle Theme
            </button> -->
        </header>

        <main>
            <div class="card">
                <div id="nextMessage" style="
              text-align: center;
              font-size: 1.4rem;
              font-weight: 600;
              margin-bottom: 14px;
              margin-top: 6px;
            "></div>

                <div class="grid" id="prayerGrid"></div>

                <!-- 🕌 Announcements Section -->
                <div id="announcements" style="
              margin: 10px 0;
              padding: 12px;
              text-align: center;
              border-radius: 8px;
              background: rgba(255, 255, 255, 0.04);
              font-size: 1.05rem;
              line-height: 1.5;
            ">
                    <div>📢 Jummah Times:</div>
                    <div>11:30 AM (Hanafi)</div>
                    <div>12:30 PM (Hanafi)</div>
                    <div>1:30 PM (Jaffari)</div>
                </div>
            </div>
        </main>

        <div id="flyerOverlay" aria-hidden="true">
            <img id="flyerImgA" class="flyer-slide active" alt="Flyer slide A" />
            <img id="flyerImgB" class="flyer-slide" alt="Flyer slide B" />
        </div>

        <footer>Auto-updating prayer board — configured for this masjid.</footer>
    </div>

    <div id="ytPlayerWrap" class="inactive" aria-label="Makkah live stream">
        <iframe id="ytPlayer" data-src="https://www.youtube.com/embed/Cm1v4bteXbI?autoplay=1&mute=1&controls=1&loop=1&playlist=Cm1v4bteXbI&modestbranding=1&rel=0"
            src="about:blank" title="Makkah live audio/video"
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </div>

    <script>
        // ===== FLYER LOGIC

        // ===== CONFIG =====
        const SECRET_CODE = "flyer123";
        const SECONDS_PER_SLIDE = 7;
        const BOARD_SECONDS = 14;
        const FETCH_TIMEOUT_MS = 8000;
        const WIDGET_URL = "https://themasjidapp.org/129307/slides/widget";
        const STORAGE_KEY = "flyerEnabled";

        // ===== STATE =====
        let flyerEnabled = localStorage.getItem(STORAGE_KEY) === "true";
        let flyerSlides = [];
        let flyerCycleTimer = null;
        let overlayHideTimer = null;

        const overlay = document.getElementById("flyerOverlay");
        const flyerImgA = document.getElementById("flyerImgA");
        const flyerImgB = document.getElementById("flyerImgB");
        const ytPlayerWrap = document.getElementById("ytPlayerWrap");
        const ytPlayer = document.getElementById("ytPlayer");

        let activeFlyerImg = flyerImgA;
        let inactiveFlyerImg = flyerImgB;

        function swapFlyerImages(nextSrc) {
            inactiveFlyerImg.src = nextSrc;

            requestAnimationFrame(() => {
                inactiveFlyerImg.classList.add("active");
                activeFlyerImg.classList.remove("active");

                const temp = activeFlyerImg;
                activeFlyerImg = inactiveFlyerImg;
                inactiveFlyerImg = temp;
            });
        }

        // Convert widget image URL to the exact size variant their widget is using
        function toWidgetDisplayUrl(url) {
            // e.g. /default -> /1080rect2x
            return url.replace(/\/default$/, "/1080rect2x");
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = FETCH_TIMEOUT_MS) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                return await fetch(url, {
                    ...options,
                    signal: controller.signal,
                });
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function loadFlyerSlides() {
            try {
                const res = await fetchWithTimeout(WIDGET_URL, { cache: "no-store" });
                const html = await res.text();

                const match = html.match(
                    /<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/
                );

                if (!match) {
                    console.warn("Could not find __NEXT_DATA__ in widget HTML");
                    return;
                }

                const data = JSON.parse(match[1]);
                const slides = data?.props?.pageProps?.masjid?.slides || [];

                flyerSlides = slides
                    .filter(
                        (slide) =>
                            slide.type === "photo" &&
                            Array.isArray(slide.slideshowIds) &&
                            slide.slideshowIds.includes("WEBSITE_WIDGET") &&
                            slide.url
                    )
                    .map((slide) => toWidgetDisplayUrl(slide.url));

                console.log("Loaded flyer slides:", flyerSlides);
            } catch (err) {
                console.error("Failed to load flyer slides:", err);
            }
        }

        function syncYtPlayerState() {
            if (!ytPlayerWrap || !ytPlayer) return;

            const targetSrc = ytPlayer.dataset.src || "";

            if (flyerEnabled) {
                ytPlayerWrap.classList.remove("inactive");
                if (ytPlayer.src !== targetSrc) {
                    ytPlayer.src = targetSrc;
                }
            } else {
                ytPlayerWrap.classList.add("inactive");
                if (ytPlayer.src !== "about:blank") {
                    ytPlayer.src = "about:blank";
                }
            }
        }

        function getFlyerDurationMs() {
            return flyerSlides.length * SECONDS_PER_SLIDE * 1000;
        }

        function getCycleDurationMs() {
            return getFlyerDurationMs() + BOARD_SECONDS * 1000;
        }

        function clearFlyerTimers() {
            if (flyerCycleTimer) clearInterval(flyerCycleTimer);
            if (overlayHideTimer) clearTimeout(overlayHideTimer);
            flyerCycleTimer = null;
            overlayHideTimer = null;
        }

        function showFlyerSequence() {
            if (!flyerEnabled || flyerSlides.length === 0) return;

            let currentIndex = 0;

            // Fully reset layers
            resetFlyerLayers(flyerSlides[currentIndex]);

            // First fade in the black overlay itself
            overlay.classList.add("show");

            // Then, on the next frame, reveal the first image
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    activeFlyerImg.classList.add("active");
                });
            });

            const slideTimer = setInterval(() => {
                currentIndex += 1;

                if (currentIndex >= flyerSlides.length) {
                    clearInterval(slideTimer);
                    overlay.classList.remove("show");

                    // Clean up both layers after fade-out begins
                    flyerImgA.classList.remove("active");
                    flyerImgB.classList.remove("active");
                    flyerImgA.removeAttribute("src");
                    flyerImgB.removeAttribute("src");
                    return;
                }

                swapFlyerImages(flyerSlides[currentIndex]);
            }, SECONDS_PER_SLIDE * 1000);

            overlayHideTimer = setTimeout(() => {
                clearInterval(slideTimer);
                overlay.classList.remove("show");

                // Full cleanup so no stale slide survives into next cycle
                flyerImgA.classList.remove("active");
                flyerImgB.classList.remove("active");
                flyerImgA.removeAttribute("src");
                flyerImgB.removeAttribute("src");
            }, getFlyerDurationMs());
        }

        function resetFlyerLayers(firstSrc) {
            // Reset both layers completely
            flyerImgA.classList.remove("active");
            flyerImgB.classList.remove("active");

            flyerImgA.removeAttribute("src");
            flyerImgB.removeAttribute("src");

            // Set first image on A only, but do NOT activate it yet
            flyerImgA.src = firstSrc;

            activeFlyerImg = flyerImgA;
            inactiveFlyerImg = flyerImgB;
        }

        function startFlyerLoop() {
            clearFlyerTimers();

            if (!flyerEnabled || flyerSlides.length === 0) return;

            // show immediately
            showFlyerSequence();

            // then repeat after full cycle (slides + board time)
            flyerCycleTimer = setInterval(() => {
                showFlyerSequence();
            }, getCycleDurationMs());
        }

        function toggleFlyer() {
            flyerEnabled = !flyerEnabled;
            localStorage.setItem(STORAGE_KEY, String(flyerEnabled));

            console.log(`Flyer rotator: ${flyerEnabled ? "ENABLED" : "DISABLED"}`);

            if (!flyerEnabled) {
                clearFlyerTimers();
                overlay.classList.remove("show");
                overlay.setAttribute("aria-hidden", "true");
            } else {
                startFlyerLoop();
            }

            syncYtPlayerState();
        }

        window.addEventListener("keydown", (e) => {
            // ignore modifier keys
            if (e.key.length !== 1) return;

            buffer += e.key.toLowerCase();
            resetBufferSoon();

            // keep buffer from growing forever
            if (buffer.length > SECRET_CODE.length) {
                buffer = buffer.slice(-SECRET_CODE.length);
            }

            if (buffer === SECRET_CODE.toLowerCase()) {
                toggleFlyer();
            }
        });

        // ====== Prayer Time LOGIC
        const PRAYERS_WIDGET_URL = "https://themasjidapp.org/129307/prayers";
        let prayersWidgetData = null;
        let prayersWidgetIqamas = {};
        let prayersWidgetJumuahs = [];
        let prayersWidgetTimezone = "America/New_York";
        let prayersWidgetHijriOffset = 0;

        const LAT = 38.912681; // Sterling, VA latitude
        const LON = -77.464279; // Sterling, VA longitude
        const MOSQUE_NAME = "Crescent Islamic Center";
        document.getElementById("mosqueName").textContent = MOSQUE_NAME;

        const calcMethod = 2;
        let timingsToday = {};
        let hijriToday = {};
        let iqamaTimes = {};
        let prayerOrder = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];

        // === Time Override for Testing ===
        // Change this to simulate different times.
        // Example: simulate 5:55 AM to test Fajr, or Friday 12:20 PM to test Jumuah.

        let TEST_TIME = null;
        // Example format: "2025-10-10T05:55:00"  (set to null for real-time)

        function getNow() {
            return TEST_TIME ? new Date(TEST_TIME) : new Date();
        }

        function refreshPrayerBoardUi() {
            if (!timingsToday["Fajr"]) return;

            updateDateLine();
            computeIqamaTimes();
            renderGrid();
            autoThemeBasedOnSun();
        }

        async function fetchTimings() {
            try {
                const today = getNow();
                const timestamp = Math.floor(today.getTime() / 1000);
                const url = `https://api.aladhan.com/v1/timings/${timestamp}?latitude=${LAT}&longitude=${LON}&method=${calcMethod}`;
                const res = await fetchWithTimeout(url, { cache: "no-store" });
                const json = await res.json();

                if (json && json.data && json.data.timings) {
                    timingsToday = json.data.timings;
                    hijriToday = json.data.date.hijri;
                    refreshPrayerBoardUi();
                } else {
                    console.error("Bad timings response", json);
                }
            } catch (err) {
                console.error("Error fetching timings", err);
                document.getElementById("dateLine").textContent =
                    "Error fetching timings (offline?)";
            }
        }

        function parseTimeToDate(timeStr) {
            const t = timeStr.split(" ")[0];
            const [hh, mm] = t.split(":").map(Number);
            const base = getNow();
            const d = new Date(base.getTime()); // make a separate copy
            d.setHours(hh, mm, 0, 0);
            return d;
        }

        // Convert date object to 12-hour format (e.g. 6:30 AM)
        function formatTime12(d) {
            return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }


        function computeIqamaTimes() {
            const now = getNow();
            const dayOfYear = String(getDayOfYear(now));
            const entry = prayersWidgetIqamas[dayOfYear];

            if (!entry) {
                console.warn("No prayers-widget iqama entry for day-of-year:", dayOfYear);
                iqamaTimes = {};
                return;
            }

            const maghribIqama = entry.maghrib ? parseWidgetTimeToDate(entry.maghrib) : null;
            const ishaIqama = entry.isha ? parseWidgetTimeToDate(entry.isha) : null;

            iqamaTimes = {
                Maghrib: maghribIqama,
                Isha: ishaIqama
            };
        }

        // helper
        function parseWidgetTimeToDate(timeStr) {
            if (!timeStr) return null;

            const [time, meridiem] = timeStr.trim().split(" ");
            let [hours, minutes] = time.split(":").map(Number);

            if (meridiem.toUpperCase() === "PM" && hours !== 12) hours += 12;
            if (meridiem.toUpperCase() === "AM" && hours === 12) hours = 0;

            const d = new Date(getNow().getTime());
            d.setHours(hours, minutes, 0, 0);
            return d;
        }

        async function loadPrayerWidgetData() {
            try {
                const res = await fetchWithTimeout(PRAYERS_WIDGET_URL, { cache: "no-store" });
                const html = await res.text();

                const match = html.match(
                    /<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/
                );

                if (!match) {
                    console.warn("Could not find __NEXT_DATA__ in prayers widget HTML");
                    return;
                }

                const data = JSON.parse(match[1]);
                const masjid = data?.props?.pageProps?.masjid;

                if (!masjid) {
                    console.warn("Prayers widget data missing masjid object");
                    return;
                }

                prayersWidgetData = data;
                prayersWidgetIqamas = masjid.iqamas || {};
                prayersWidgetTimezone = masjid.timezone || "America/New_York";
                prayersWidgetHijriOffset = masjid.hijriOffset || 0;

                prayersWidgetJumuahs = (masjid.events || [])
                    .filter((e) => e.isJuma)
                    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                console.log("Loaded prayers widget data", {
                    timezone: prayersWidgetTimezone,
                    hijriOffset: prayersWidgetHijriOffset,
                    iqamaCount: Object.keys(prayersWidgetIqamas).length,
                    jumuahCount: prayersWidgetJumuahs.length,
                });

                refreshPrayerBoardUi();
            } catch (err) {
                console.error("Failed to load prayers widget data:", err);
            }
        }

        function setSpecificTime(hours24, minutes) {
            const d = getNow();
            d.setHours(hours24, minutes, 0, 0);
            return d;
        }

        function renderGrid() {
            const grid = document.getElementById("prayerGrid");
            grid.innerHTML = "";

            if (!timingsToday["Fajr"] || !timingsToday["Sunrise"] || !timingsToday["Maghrib"]) {
                grid.innerHTML = `
                    <div class="prayer" style="grid-column: 1 / -1;">
                        Loading prayer times…
                    </div>
                `;
                return;
            }

            const now = getNow();
            const day = now.getDay(); // 0=Sun ... 5=Fri

            let prayers = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];

            // Show Jumuah cards from Thursday Maghrib until Friday Maghrib
            const maghribToday = parseTimeToDate(timingsToday["Maghrib"]);
            let showJumuah = false;

            if (day === 5) {
                if (now < maghribToday) showJumuah = true;
            } else if (day === 4) {
                if (now >= maghribToday) showJumuah = true;
            }

            if (showJumuah) {
                prayers = ["Fajr", "Sunrise", "Jumuah 1", "Jumuah 2", "Jumuah 3", "Asr", "Maghrib", "Isha"];
            }

            const ann = document.getElementById("announcements");
            if (ann) {
                ann.style.display = showJumuah ? "none" : "block";
            }

            const nowMs = now.getTime();
            const events = [];

            for (const p of prayers) {
                if (p.startsWith("Jumuah")) {
                    const index = parseInt(p.split(" ")[1], 10) - 1;
                    const info = prayersWidgetJumuahs[index];

                    if (!info) continue;

                    const d = parseWidgetTimeToDate(info.timeDesc);

                    events.push({
                        name: p,
                        adhan: d,
                        madhhab: info.desc || ""
                    });
                } else if (p === "Sunrise") {
                    const t = parseTimeToDate(timingsToday["Sunrise"]);
                    events.push({ name: "Sunrise", adhan: t });
                } else {
                    const adhan = parseTimeToDate(timingsToday[p]);
                    const iq = iqamaTimes[p];
                    events.push({ name: p, adhan, iqama: iq });
                }
            }

            let upcoming = events
                .filter((e) => {
                    const t = e.iqama || e.adhan;
                    return t && t.getTime() > nowMs;
                })
                .sort((a, b) => {
                    const ta = a.iqama ? a.iqama.getTime() : a.adhan.getTime();
                    const tb = b.iqama ? b.iqama.getTime() : b.adhan.getTime();
                    return ta - tb;
                })[0];

            if (!upcoming) {
                const fajrEvent = events.find((e) => e.name === "Fajr");
                if (fajrEvent) {
                    upcoming = {
                        name: "Fajr",
                        adhan: new Date(fajrEvent.adhan.getTime() + 24 * 3600 * 1000),
                        iqama: fajrEvent.iqama
                            ? new Date(fajrEvent.iqama.getTime() + 24 * 3600 * 1000)
                            : null,
                    };
                }
            }

            for (const e of events) {
                const adhanStr = e.adhan ? formatTime12(e.adhan) : "--:--";
                const div = document.createElement("div");

                div.className = "prayer";
                if (upcoming && e.name === upcoming.name) {
                    div.classList.add("current");
                }

                if (e.name.startsWith("Jumuah")) {
                    div.innerHTML = `
                        <div class="name">${e.name}</div>
                        <div class="time">${adhanStr}</div>
                        <div class="iqama">${e.madhhab}</div>
                    `;
                } else if (e.name === "Sunrise") {
                    div.innerHTML = `
                        <div class="name">Shuruq</div>
                        <div class="time">${adhanStr}</div>
                    `;
                } else {
                    const iqStr = e.iqama ? formatTime12(e.iqama) : null;
                    div.innerHTML = `
                        <div class="name">${e.name}</div>
                        <div class="time">${adhanStr}</div>
                        ${iqStr ? `<div class="iqama">Iqama: ${iqStr}</div>` : ""}
                    `;
                }

                grid.appendChild(div);
            }

            updateCountdown(upcoming, events);
        }

        function updateDateLine() {
            const now = getNow();

            // 🗓️ Gregorian date
            const gregorian = now.toLocaleDateString(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
            });

            // 🕋 Get Hijri date (prefer API, fallback to Intl)
            let hijriDay, hijriMonth, hijriYear;
            if (
                hijriToday &&
                hijriToday.day &&
                hijriToday.month &&
                hijriToday.year
            ) {
                hijriDay = parseInt(hijriToday.day);
                hijriMonth = hijriToday.month.en;
                hijriYear = hijriToday.year;
            } else {
                const hijriFormatter = new Intl.DateTimeFormat("en-u-ca-islamic", {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                });
                const parts = hijriFormatter.formatToParts(now);
                hijriDay = parts.find((p) => p.type === "day").value;
                hijriMonth = parts.find((p) => p.type === "month").value;
                hijriYear = parts.find((p) => p.type === "year").value;
            }

            // 🌇 Adjust Hijri rollover after Maghrib
            // 🌇 Adjust Hijri rollover after Maghrib (using API-based Hijri date only)
            if (timingsToday["Maghrib"]) {
                const maghrib = parseTimeToDate(timingsToday["Maghrib"]);
                if (now >= maghrib && hijriToday && hijriToday.day) {
                    let nextDay = parseInt(hijriToday.day) + 1;
                    let nextMonth = hijriToday.month.en;
                    let nextYear = parseInt(hijriToday.year);

                    // Handle month rollover (29–30 days)
                    if (nextDay > 30) {
                        nextDay = 1;
                        // We could optionally handle month rollover properly via a month list
                        // but AlAdhan will refresh at midnight anyway with correct next Hijri date.
                    }

                    hijriDay = nextDay;
                    hijriMonth = nextMonth;
                    hijriYear = nextYear;
                }
            }

            // 📜 Normalize month names for nicer display
            const monthMap = {
                Muharram: "Muḥarram",
                Safar: "Ṣafar",
                "Rabiʻ I": "Rabīʿ al-Awwal",
                "Rabiʻ II": "Rabīʿ al-Thānī",
                "Jumada I": "Jumādā al-Ūlā",
                "Jumada II": "Jumādā al-Ākhirah",
                Rajab: "Rajab",
                Shaʻban: "Shaʿbān",
                Ramadan: "Ramaḍān",
                Shawwal: "Shawwāl",
                "Dhuʻl-Qaʻdah": "Dhū al-Qaʿdah",
                "Dhuʻl-Hijjah": "Dhū al-Ḥijjah",
            };

            if (monthMap[hijriMonth]) hijriMonth = monthMap[hijriMonth];

            // 🧾 Combine nicely
            const hijriText = `${hijriDay} ${hijriMonth} ${hijriYear} AH`;

            document.getElementById("dateLine").innerHTML = `
    <span>${gregorian}</span>
    <span style="opacity:0.5;margin:0 8px;">|</span>
    <span id="hijriDate" style="color:var(--hijri-color);font-weight:500;">
      ${hijriText}
    </span>
  `;
        }

        function updateCountdown(upcoming, events) {
            const nextMsg = document.getElementById("nextMessage");
            const now = getNow();

            if (!upcoming || (!upcoming.iqama && !upcoming.adhan)) {
                nextMsg.innerHTML = "";
                return;
            }

            const countdownString = (target) => {
                if (!target) return "--:--:--";
                let t = target;
                if (t < now) t = new Date(t.getTime() + 24 * 3600 * 1000);
                const diff = t - now;
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                return `${String(h).padStart(2, "0")}:${String(m).padStart(
                    2,
                    "0"
                )}:${String(s).padStart(2, "0")}`;
            };

            let message = "";
            let countdownTarget = null;
            let phaseClass = "phase-next"; // default

            if (upcoming.name === "Sunrise") {
                message = `🌅 Sunrise is at ${formatTime12(
                    upcoming.adhan
                )} — in ${countdownString(upcoming.adhan)}`;
                countdownTarget = upcoming.adhan;
                phaseClass = "phase-shuruq";
            } else if (upcoming.name.startsWith("Jumuah")) {
                message = `🕌 The next Jumuah (${upcoming.name
                    }) is in ${countdownString(upcoming.adhan)}`;
                countdownTarget = upcoming.adhan;
                phaseClass = "phase-jumuah";
            } else {
                const adhan = upcoming.adhan;
                const iqama = upcoming.iqama;

                if (now < adhan) {
                    message = `🕰️ ${upcoming.name} time begins in ${countdownString(
                        adhan
                    )}`;
                    countdownTarget = adhan;
                    phaseClass = "phase-before";
                } else if (now >= adhan && now < iqama) {
                    message = `🙏 The Iqama for ${upcoming.name
                        } will be in ${countdownString(iqama)}`;
                    countdownTarget = iqama;
                    phaseClass = "phase-iqama";
                } else {
                    const currentIdx = events.findIndex(
                        (e) => e.name === upcoming.name
                    );
                    let nextEvent = events[currentIdx + 1];
                    if (!nextEvent) {
                        nextEvent = events.find((e) => e.name === "Fajr");
                        if (nextEvent) {
                            const nextFajrAdhan = new Date(
                                nextEvent.adhan.getTime() + 24 * 3600 * 1000
                            );
                            message = `🕰️ Next prayer (Fajr) time begins in ${countdownString(
                                nextFajrAdhan
                            )}`;
                            countdownTarget = nextFajrAdhan;
                            phaseClass = "phase-next";
                        }
                    } else {
                        message = `🕰️ Next prayer (${nextEvent.name
                            }) time begins in ${countdownString(nextEvent.adhan)}`;
                        countdownTarget = nextEvent.adhan;
                        phaseClass = "phase-next";
                    }
                }
            }

            // Determine current phase key (for comparison)
            const currentPhaseKey = phaseClass + "-" + upcoming.name;

            // If the phase changed (not just countdown ticking), fade
            if (nextMsg.dataset.phase !== currentPhaseKey) {
                nextMsg.classList.add("fade-out");
                setTimeout(() => {
                    nextMsg.innerHTML = message;
                    nextMsg.className = "";
                    nextMsg.classList.add(phaseClass);
                    nextMsg.dataset.phase = currentPhaseKey;
                }, 300);
                setTimeout(() => nextMsg.classList.remove("fade-out"), 400);
            } else {
                // Same phase — just update countdown text without fading
                nextMsg.innerHTML = message;
            }
        }

        async function initializePrayerBoard() {
            renderGrid();

            const results = await Promise.allSettled([
                loadPrayerWidgetData(),
                fetchTimings(),
            ]);

            const failures = results.filter((result) => result.status === "rejected");
            if (failures.length > 0) {
                console.warn("Prayer board initialization completed with fetch failures.", failures);
            }
        }

        function updateLiveClock() {
            const now = getNow();
            const timeString = now.toLocaleTimeString([], {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit",
            });
            document.getElementById("liveClock").textContent = timeString;
        }
        updateLiveClock();
        syncYtPlayerState();
        initializePrayerBoard();
        setInterval(updateLiveClock, 1000);
        setInterval(updateDateLine, 60000); // update every minute
        setInterval(fetchTimings, 5 * 60 * 1000);
        setInterval(loadPrayerWidgetData, 30 * 60 * 1000);
        const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
        setTimeout(() => {
            console.log("Weekly auto-refresh triggered");
            location.reload(true);
        }, WEEK_MS);

        // 🌙 Auto theme switching (and manual toggle)
        function applyTheme(mode) {
            if (mode === "dark") {
                document.body.classList.add("dark");
            } else {
                document.body.classList.remove("dark");
            }
            localStorage.setItem("theme", mode);
        }

        // Manual toggle handler
        // document.getElementById("themeToggle").addEventListener("click", () => {
        //     const current = document.body.classList.contains("dark") ? "dark" : "light";
        //     const newMode = current === "dark" ? "light" : "dark";
        //     applyTheme(newMode);
        // });

        // Automatic mode based on prayer times
        function autoThemeBasedOnSun() {
            if (!timingsToday["Fajr"] || !timingsToday["Maghrib"]) return;

            // Always evaluate everything in the same timezone (Eastern)
            const TIMEZONE = "America/New_York";

            const now = getNow();
            const fajr = parseTimeToDate(timingsToday["Fajr"]);
            const maghrib = parseTimeToDate(timingsToday["Maghrib"]);

            // If current time is after Maghrib or before Fajr → dark mode
            if (now < fajr || now >= maghrib) {
                applyTheme("dark");
            } else {
                applyTheme("light");
            }
        }

        const logo = document.getElementById("mosqueLogo");

        if (logo) {
            logo.style.cursor = "pointer"; // visual hint

            logo.addEventListener("click", () => {
                toggleFlyer();
            });
        }

        // Re-check automatically every minute
        setInterval(autoThemeBasedOnSun, 60000);
        (async function initFlyers() {
            await loadFlyerSlides();

            // optional: refresh slide list every 10 minutes so changes on MasjidApp propagate
            setInterval(loadFlyerSlides, 10 * 60 * 1000);

            if (flyerEnabled) {
                startFlyerLoop();
            }
        })();
    </script>
